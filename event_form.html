{% extends "adminpanel/base.html" %}
{% block title %}{{ title }} - EventHub{% endblock %}
{% block admin_content %}
<div class="row justify-content-center"><div class="col-xl-8"><div class="card shadow-sm"><div class="card-body p-4">
<h2 class="fw-bold mb-4">{{ title }}</h2>
<form method="post">{% csrf_token %}
{% for field in form %}
<div class="mb-3"><label class="form-label fw-semibold">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>
{% endfor %}
<button class="btn btn-primary">Save Event</button><a href="{% url 'admin_events' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
</form>
</div></div></div></div>
{% endblock %}
