{% extends "base.html" %}
{% block title %}Profile - EventHub{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow-sm"><div class="card-body p-4">
        <h2 class="fw-bold">User Profile</h2>
        <p class="text-secondary">Update your personal information.</p>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3"><label class="form-label fw-semibold">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>
          {% endfor %}
          <button class="btn btn-primary">Save Changes</button>
          <a href="{% url 'password_change' %}" class="btn btn-outline-dark ms-2">Change Password</a>
        </form>
      </div></div>
    </div>
  </div>
</div>
{% endblock %}
