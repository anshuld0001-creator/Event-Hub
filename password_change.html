{% extends "base.html" %}
{% block title %}Change Password - EventHub{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-6">
<div class="card shadow-sm"><div class="card-body p-4">
<h2 class="fw-bold">Change Password</h2>
<form method="post">{% csrf_token %}
{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}
<button class="btn btn-primary">Update Password</button>
</form>
</div></div></div></div></div>
{% endblock %}
