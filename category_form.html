{% extends "adminpanel/base.html" %}
{% block title %}{{ title }} - EventHub{% endblock %}
{% block admin_content %}
<div class="row justify-content-center"><div class="col-xl-7"><div class="card shadow-sm"><div class="card-body p-4">
<h2 class="fw-bold">{{ title }}</h2><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Save</button> <a href="{% url 'admin_categories' %}" class="btn btn-outline-secondary">Cancel</a></form>
</div></div></div></div>
{% endblock %}
